<div x-data="transactionsPage()" x-init="init()" class="absolute inset-0 flex flex-col">

  <!-- ===== Top Header ===== -->
  <header class="w-full bg-white border-b border-g-100 flex items-center justify-between px-4 py-6 shrink-0">
    <!-- Global search w/ ⌘K -->
    <div class="relative">
      <button @click="openCommandPalette()" class="bg-white rounded-full shadow-card flex items-center gap-2 px-3 py-2 w-[238px] cursor-text hover:shadow-md transition-shadow focus:outline-none focus:ring-2 focus:ring-p-300">
        <span class="ic ic-16 ic-search text-g-400"></span>
        <span class="flex-1 text-left text-[14px] font-medium tracking-wide2 text-g-400">Search anything…</span>
        <kbd class="text-[11px] font-medium bg-g-50 border border-g-100 rounded px-1.5 py-0.5 text-g-400">⌘K</kbd>
      </button>
    </div>

    <div class="flex items-center gap-4">
      <!-- Bell with dropdown -->
      <div class="relative" x-data="{ open: false }" @click.outside="open = false">
        <button @click="open = !open" class="relative bg-white rounded-full shadow-card p-2.5 flex items-center justify-center hover:bg-g-25 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300">
          <span class="ic ic-20 ic-bell text-g-900"></span>
          <span class="absolute top-[11px] right-[11px] w-1.5 h-1.5 rounded-full bg-err-100 border border-white"></span>
        </button>
        <div x-show="open" x-cloak x-transition.opacity
             class="absolute right-0 top-full mt-2 w-[340px] bg-white border border-g-100 rounded-xl shadow-pop overflow-hidden z-20">
          <div class="px-4 py-3 border-b border-g-100 flex items-center justify-between">
            <h3 class="text-[14px] font-semibold text-g-900">Notifications</h3>
            <button @click="window.toast('Marked all as read', { type: 'success' }); open = false" class="text-[12px] text-s-300 font-medium hover:underline">Mark all read</button>
          </div>
          <div class="max-h-[320px] overflow-y-auto">
            <template x-for="n in notifications" :key="n.id">
              <button @click="window.toast(n.title); open = false" class="w-full text-left px-4 py-3 flex items-start gap-3 hover:bg-g-25 transition-colors border-b border-g-100 last:border-0">
                <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0" :style="'background:' + n.color">
                  <span class="text-[14px]" x-text="n.icon"></span>
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-[13px] font-medium text-g-900" x-text="n.title"></p>
                  <p class="text-[12px] text-g-400 mt-0.5" x-text="n.time"></p>
                </div>
                <span x-show="n.unread" class="w-2 h-2 rounded-full bg-s-300 mt-2 shrink-0"></span>
              </button>
            </template>
          </div>
          <div class="px-4 py-2 border-t border-g-100 bg-g-25">
            <button class="w-full text-[12px] font-medium text-s-300 py-1 hover:underline">View all notifications</button>
          </div>
        </div>
      </div>

      <div class="vdiv"></div>
      <button @click="window.openReferral()" class="flex items-center gap-2 h-10 px-3 pr-4 rounded-full text-white text-[14px] font-medium tracking-wide2 border border-g-500 shadow-card hover:brightness-110 transition focus:outline-none focus:ring-2 focus:ring-p-300"
              style="background-image: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0) 100%), linear-gradient(90deg, #163300 0%, #163300 100%);">
        <span class="ic ic-20 ic-gift text-white"></span>
        Earn $90
      </button>
    </div>
  </header>

  <!-- ===== Page title + actions ===== -->
  <section class="w-full border-b border-g-100 flex items-center gap-4 p-4 shrink-0">
    <div class="flex-1 flex flex-col gap-1 min-w-0">
      <h1 class="text-[24px] font-semibold leading-[1.3] tracking-tight2 text-g-900">Transactions</h1>
      <p class="text-[14px] text-g-400">
        <span x-text="filtered.length"></span> of <span x-text="transactions.length"></span> transactions
        <template x-if="selected.length"><span class="text-s-300 font-medium" x-text="'• ' + selected.length + ' selected'"></span></template>
        <template x-if="hasActiveFilters"><button @click="resetFilters()" class="ml-2 text-s-300 hover:underline text-[12px] font-medium">Clear filters</button></template>
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button @click="exportData()" class="bg-white border border-g-100 rounded-full shadow-card h-12 px-4 flex items-center gap-2 hover:bg-g-25 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300">
        <span class="ic ic-20 ic-clipboard text-g-900"></span>
        <span class="text-[16px] font-semibold leading-[1.5] tracking-wide3 text-g-900">Export</span>
      </button>
      <button @click="newTxnOpen = true" class="bg-p-300 rounded-full h-12 px-4 flex items-center gap-2 hover:bg-p-200 transition-colors focus:outline-none focus:ring-2 focus:ring-s-300">
        <span class="ic ic-20 ic-plus" style="color:#163300"></span>
        <span class="text-[16px] font-semibold leading-[1.5] tracking-wide3 text-s-300">New Transaction</span>
      </button>
    </div>
  </section>

  <!-- ===== Stats Row (clickable quick-filter) ===== -->
  <section class="w-full px-4 pt-4 flex items-start gap-4 shrink-0">
    <template x-for="card in statsCards" :key="card.key">
      <button @click="card.filter && applyQuickFilter(card.filter)"
              class="flex-1 bg-white rounded-xl shadow-card p-4 flex items-center overflow-hidden text-left hover:shadow-md transition-shadow focus:outline-none focus:ring-2 focus:ring-p-300">
        <div class="flex-1 flex flex-col gap-2 min-w-0">
          <div class="flex items-center gap-3 w-full">
            <span class="flex-1 text-[14px] font-semibold leading-[1.5] tracking-wide2 text-g-900" x-text="card.label"></span>
            <span @click.stop="openMenu($event, card.menu, null)" class="ic ic-16 ic-dots-v text-g-900 hover:text-g-400 cursor-pointer"></span>
          </div>
          <div class="flex items-center gap-2 w-full">
            <span class="text-[24px] font-semibold leading-[1.3] tracking-tight2 text-g-900 whitespace-nowrap" x-text="card.value"></span>
            <template x-if="card.badge">
              <span class="h-6 rounded-md px-1 flex items-center justify-center text-[12px] font-semibold leading-[1.5] tracking-wide1 border"
                    :class="card.badgeClass" x-text="card.badge"></span>
            </template>
          </div>
        </div>
      </button>
    </template>
  </section>

  <!-- ===== Filter Bar ===== -->
  <section class="w-full px-4 pt-4 pb-3 flex items-center gap-3 shrink-0">
    <!-- Search input -->
    <div class="bg-white rounded-full shadow-card flex items-center gap-2 px-3 py-2 w-[300px] focus-within:ring-2 focus-within:ring-p-300 transition-shadow">
      <span class="ic ic-16 ic-search text-g-400"></span>
      <input type="text" x-model="search" placeholder="Search by name, note, category..." x-ref="searchInput"
             class="flex-1 bg-transparent outline-none text-[14px] tracking-wide2 text-g-900 placeholder:text-g-400" />
      <template x-if="search">
        <button @click="search = ''" class="text-g-400 hover:text-g-900 text-[14px]">✕</button>
      </template>
      <kbd class="text-[11px] font-medium bg-g-50 border border-g-100 rounded px-1.5 py-0.5 text-g-400" x-show="!search">/</kbd>
    </div>

    <!-- Type filter chips -->
    <div class="bg-g-50 border border-g-100 rounded-full flex items-center overflow-hidden h-9">
      <template x-for="t in types" :key="t">
        <button @click="typeFilter = t; page = 1"
                class="px-3 h-full flex items-center text-[12px] tracking-wide1 transition-colors focus:outline-none"
                :class="typeFilter === t ? 'bg-white text-g-900 font-semibold rounded-full m-0.5 shadow-card' : 'text-g-400 font-medium hover:text-g-900'"
                x-text="t"></button>
      </template>
    </div>

    <!-- Status filter -->
    <div class="relative" x-data="{ open: false }" @click.outside="open = false">
      <button @click="open = !open" class="bg-white border border-g-100 rounded-full h-9 px-3 flex items-center gap-2 hover:bg-g-25 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300">
        <span class="text-[12px] font-medium text-g-900">Status: <span x-text="statusFilter"></span></span>
        <span class="ic ic-16 ic-chevron-down text-g-900"></span>
      </button>
      <div x-show="open" @click.outside="open = false" x-cloak x-transition.opacity
           class="absolute top-full mt-2 left-0 bg-white border border-g-100 rounded-lg shadow-pop py-1 z-10 min-w-[180px]">
        <template x-for="s in statuses" :key="s">
          <button @click="statusFilter = s; page = 1; open = false"
                  class="w-full text-left px-3 py-2 text-[12px] hover:bg-g-25 flex items-center gap-2"
                  :class="statusFilter === s ? 'font-semibold text-g-900 bg-g-25' : 'text-g-400'">
            <span class="w-2 h-2 rounded-full"
                  :class="{
                    'bg-g-300': s === 'All',
                    'bg-suc-100': s === 'Completed',
                    'bg-[#FFA500]': s === 'Pending',
                    'bg-por-100': s === 'Scheduled',
                    'bg-err-100': s === 'Failed'
                  }"></span>
            <span x-text="s"></span>
          </button>
        </template>
      </div>
    </div>

    <div class="flex-1"></div>

    <!-- More filters (toggles advanced panel) -->
    <button @click="advancedFilters = !advancedFilters"
            class="rounded-full h-9 px-3 flex items-center gap-2 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300"
            :class="advancedFilters ? 'bg-s-300 text-white border border-s-300' : 'bg-white border border-g-100 text-g-900 hover:bg-g-25'">
      <span class="ic ic-16 ic-filter"></span>
      <span class="text-[12px] font-medium">More filters</span>
      <span x-show="activeAdvancedCount" class="bg-p-300 text-s-300 rounded-full px-1.5 text-[10px] font-semibold" x-text="activeAdvancedCount"></span>
    </button>

    <!-- Date range -->
    <div class="relative" x-data="{ open: false }" @click.outside="open = false">
      <button @click="open = !open" class="bg-white border border-g-100 rounded-full h-9 px-3 flex items-center gap-2 hover:bg-g-25 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300">
        <span class="ic ic-16 ic-plus text-g-900"></span>
        <span class="text-[12px] font-medium text-g-900" x-text="monthLabel"></span>
        <span class="ic ic-16 ic-chevron-down text-g-900"></span>
      </button>
      <div x-show="open" x-cloak x-transition.opacity
           class="absolute top-full mt-2 right-0 bg-white border border-g-100 rounded-xl shadow-pop p-3 z-10 w-[280px]">
        <div class="flex items-center justify-between mb-3">
          <button @click="yearOffset--" class="w-8 h-8 rounded-full hover:bg-g-25 flex items-center justify-center text-g-900">‹</button>
          <span class="text-[13px] font-semibold text-g-900" x-text="2024 + yearOffset"></span>
          <button @click="yearOffset++" class="w-8 h-8 rounded-full hover:bg-g-25 flex items-center justify-center text-g-900">›</button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <template x-for="(m, i) in monthsList" :key="m">
            <button @click="setMonth(i); open = false"
                    class="h-9 rounded-lg text-[12px] font-medium transition-colors"
                    :class="(i === monthIndex && yearOffset === activeYearOffset) ? 'bg-s-300 text-white' : 'text-g-900 hover:bg-g-25'"
                    x-text="m"></button>
          </template>
        </div>
        <div class="border-t border-g-100 mt-3 pt-3 flex items-center gap-2">
          <button @click="setMonth(null); open = false" class="flex-1 h-9 rounded-full border border-g-100 text-[12px] font-medium text-g-900 hover:bg-g-25 transition-colors">All time</button>
          <button @click="setMonthToCurrent(); open = false" class="flex-1 h-9 rounded-full bg-p-300 text-[12px] font-semibold text-s-300 hover:bg-p-200 transition-colors">This month</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Advanced Filters Panel ===== -->
  <div x-show="advancedFilters" x-cloak x-transition class="w-full px-4 pb-3 shrink-0">
    <div class="bg-white border border-g-100 rounded-xl p-4 grid grid-cols-4 gap-4">
      <!-- Amount range -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-g-400">Amount range</label>
        <div class="flex items-center gap-2">
          <input type="number" placeholder="Min" x-model.number="amountMin" class="w-full h-9 px-3 rounded-lg border border-g-100 text-[13px] text-g-900 focus:outline-none focus:ring-2 focus:ring-p-300"/>
          <span class="text-g-400">–</span>
          <input type="number" placeholder="Max" x-model.number="amountMax" class="w-full h-9 px-3 rounded-lg border border-g-100 text-[13px] text-g-900 focus:outline-none focus:ring-2 focus:ring-p-300"/>
        </div>
      </div>
      <!-- Category -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-g-400">Category</label>
        <select x-model="categoryFilter" class="h-9 px-3 rounded-lg border border-g-100 text-[13px] text-g-900 bg-white focus:outline-none focus:ring-2 focus:ring-p-300">
          <template x-for="c in categories" :key="c"><option x-text="c" :value="c"></option></template>
        </select>
      </div>
      <!-- Sort -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-g-400">Sort by</label>
        <div class="flex items-center gap-2">
          <select x-model="sort.key" class="flex-1 h-9 px-3 rounded-lg border border-g-100 text-[13px] text-g-900 bg-white focus:outline-none focus:ring-2 focus:ring-p-300">
            <option value="date">Date</option><option value="amount">Amount</option><option value="name">Name</option><option value="status">Status</option>
          </select>
          <button @click="sort.dir = sort.dir === 'asc' ? 'desc' : 'asc'" class="w-9 h-9 rounded-lg border border-g-100 hover:bg-g-25 text-[13px] text-g-900" x-text="sort.dir === 'asc' ? '↑' : '↓'"></button>
        </div>
      </div>
      <!-- Reset / apply -->
      <div class="flex flex-col gap-1.5">
        <label class="text-[12px] font-medium text-g-400">&nbsp;</label>
        <div class="flex items-center gap-2">
          <button @click="resetFilters(); window.toast('Filters reset', { type: 'info' })" class="flex-1 h-9 rounded-lg border border-g-100 text-[13px] font-medium text-g-900 hover:bg-g-25 transition-colors">Reset</button>
          <button @click="advancedFilters = false; window.toast('Filters applied', { type: 'success' })" class="flex-1 h-9 rounded-lg bg-s-300 text-white text-[13px] font-semibold hover:bg-s-200 transition-colors">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Bulk Action Bar ===== -->
  <div x-show="selected.length > 0" x-cloak x-transition.opacity class="w-full px-4 pb-3 shrink-0">
    <div class="bg-s-300 rounded-lg flex items-center gap-3 px-4 py-3 text-white">
      <span class="text-[14px] font-medium" x-text="selected.length + ' transaction' + (selected.length > 1 ? 's' : '') + ' selected'"></span>
      <div class="flex-1"></div>
      <button @click="bulkMarkPaid()" class="text-[13px] font-medium px-3 py-1.5 rounded-full hover:bg-white/10 transition-colors">Mark as paid</button>
      <button @click="bulkExport()" class="text-[13px] font-medium px-3 py-1.5 rounded-full hover:bg-white/10 transition-colors">Export</button>
      <button @click="bulkDelete()" class="text-[13px] font-medium px-3 py-1.5 rounded-full hover:bg-white/10 transition-colors text-[rgb(255,180,180)]">Delete</button>
      <button @click="selected = []" class="text-white/70 hover:text-white text-lg" title="Clear">✕</button>
    </div>
  </div>

  <!-- ===== Table ===== -->
  <section class="flex-1 mx-4 mb-4 bg-white rounded-xl shadow-card flex flex-col overflow-hidden">
    <!-- Empty -->
    <template x-if="filtered.length === 0">
      <div class="flex-1 flex flex-col items-center justify-center gap-3 p-8">
        <div class="w-16 h-16 rounded-full bg-g-25 flex items-center justify-center">
          <span class="ic ic-search text-g-400" style="width: 28px; height: 28px; -webkit-mask-size: 22px 22.5px; mask-size: 22px 22.5px;"></span>
        </div>
        <div class="text-center">
          <h3 class="text-[16px] font-semibold text-g-900">No transactions found</h3>
          <p class="text-[14px] text-g-400 mt-1">Try changing your filters or search terms.</p>
        </div>
        <button @click="resetFilters()" class="bg-white border border-g-100 rounded-full h-10 px-4 text-[13px] font-medium text-g-900 hover:bg-g-25 transition-colors">Reset filters</button>
      </div>
    </template>

    <div x-show="filtered.length > 0" class="flex flex-col flex-1 min-h-0">
      <!-- Header row -->
      <div class="bg-g-25 border-b border-g-100 flex items-center h-10 shrink-0">
        <div class="w-12 flex items-center justify-center">
          <button @click="toggleAll()" :title="allSelected ? 'Deselect all' : 'Select all'"
                  class="w-4 h-4 rounded-sm shadow-cb flex items-center justify-center transition-colors hover:scale-110"
                  :class="allSelected ? 'bg-s-300' : (someSelected ? 'bg-s-300/60' : 'bg-white')">
            <span x-show="allSelected || someSelected" class="text-white text-[10px] leading-none" x-text="allSelected ? '✓' : '–'"></span>
          </button>
        </div>
        <template x-for="col in columns" :key="col.key">
          <button @click="sortBy(col.key)" class="px-4 flex items-center gap-1 text-left group h-full" :style="col.style">
            <span class="text-[12px] font-medium leading-[1.5] tracking-wide1 text-g-400 whitespace-nowrap group-hover:text-g-900 transition-colors" x-text="col.label"></span>
            <span class="text-[10px] transition-opacity"
                  :class="sort.key === col.key ? 'opacity-100 text-g-900' : 'opacity-0 group-hover:opacity-50 text-g-400'"
                  x-text="sort.key === col.key ? (sort.dir === 'asc' ? '↑' : '↓') : '↕'"></span>
          </button>
        </template>
        <div class="w-12"></div>
      </div>

      <!-- Body (paginated) -->
      <div class="flex-1 overflow-y-auto">
        <template x-for="t in paged" :key="t.id">
          <div class="border-b border-g-100 flex items-center h-14 hover:bg-g-25 transition-colors cursor-pointer group relative"
               :class="selected.includes(t.id) ? 'bg-p-200/10' : ''"
               @click="openDetail(t)">
            <div class="w-12 flex items-center justify-center" @click.stop>
              <button @click="toggleOne(t.id)"
                      class="w-4 h-4 rounded-sm shadow-cb flex items-center justify-center transition-all hover:scale-110"
                      :class="selected.includes(t.id) ? 'bg-s-300' : 'bg-white'">
                <span x-show="selected.includes(t.id)" class="text-white text-[10px] leading-none">✓</span>
              </button>
            </div>
            <div class="px-4 flex items-center gap-3" style="width: 240px;">
              <template x-if="t.avatar"><img :src="t.avatar" alt="" class="w-6 h-6 rounded-full object-cover shrink-0" /></template>
              <template x-if="t.brandIcon">
                <div class="w-6 h-6 rounded-full overflow-hidden flex items-center justify-center shrink-0" :style="'background:' + t.brandBg">
                  <img :src="t.brandIcon" alt="" class="w-3.5 h-3.5" />
                </div>
              </template>
              <span class="text-[14px] font-medium tracking-wide2 text-g-900 truncate" x-text="t.name"></span>
            </div>
            <div class="px-4" style="width: 120px;"><span class="text-[14px] font-medium tracking-wide2 text-g-900" x-text="t.type"></span></div>
            <div class="px-4" style="width: 140px;"><button @click.stop="categoryFilter = t.category; window.toast('Filtered by ' + t.category, { type: 'info' })" class="bg-g-50 hover:bg-g-100 rounded-full px-2 py-0.5 text-[12px] font-medium text-g-500 transition-colors" x-text="t.category"></button></div>
            <div class="px-4" style="width: 130px;">
              <span class="text-[14px] font-semibold tracking-wide2 whitespace-nowrap" :class="t.amount >= 0 ? 'text-suc-200' : 'text-g-900'" x-text="formatAmount(t.amount)"></span>
            </div>
            <div class="px-4 flex-1 min-w-0"><span class="text-[14px] font-medium tracking-wide2 text-g-900" x-text="formatDate(t.date)"></span></div>
            <div class="px-4" style="width: 120px;">
              <button @click.stop="statusFilter = t.status; window.toast('Filtered by ' + t.status, { type: 'info' })" class="rounded-full px-2 py-0.5 text-[12px] font-semibold tracking-wide1 border hover:brightness-95 transition"
                    :class="{
                      'bg-suc-0 border-[rgba(64,196,170,0.2)] text-suc-200': t.status === 'Completed',
                      'bg-por-0 border-por-25 text-por-100': t.status === 'Scheduled',
                      'bg-[#FFF7E5] border-[rgba(255,170,0,0.2)] text-[#B8860B]': t.status === 'Pending',
                      'bg-err-0 border-[rgba(223,28,65,0.1)] text-err-200': t.status === 'Failed'
                    }" x-text="t.status"></button>
            </div>
            <div class="w-12 flex items-center justify-center" @click.stop>
              <button @click="openMenu($event, rowMenu, t)" class="w-7 h-7 rounded-full flex items-center justify-center hover:bg-g-100 transition-colors focus:outline-none focus:ring-2 focus:ring-p-300">
                <span class="ic ic-16 ic-dots-v text-g-900"></span>
              </button>
            </div>
          </div>
        </template>
      </div>

      <!-- Pagination -->
      <div class="border-t border-g-100 h-12 flex items-center px-4 shrink-0 bg-g-25">
        <span class="text-[12px] text-g-400">
          Showing <span class="font-medium text-g-900" x-text="((page - 1) * perPage) + 1"></span>–<span class="font-medium text-g-900" x-text="Math.min(page * perPage, filtered.length)"></span> of
          <span class="font-medium text-g-900" x-text="filtered.length"></span>
        </span>
        <div class="flex-1"></div>
        <select x-model.number="perPage" @change="page = 1" class="h-7 text-[12px] border border-g-100 rounded-lg px-2 mr-3 bg-white text-g-900 focus:outline-none">
          <option :value="5">5 / page</option><option :value="10">10 / page</option><option :value="20">20 / page</option>
        </select>
        <div class="flex items-center gap-1">
          <button @click="prevPage()" :disabled="page === 1"
                  class="w-8 h-8 rounded-lg border border-g-100 bg-white text-g-400 hover:text-g-900 hover:bg-white disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center">‹</button>
          <template x-for="p in totalPages" :key="p">
            <button @click="page = p"
                    class="w-8 h-8 rounded-lg text-[12px] font-semibold transition-colors"
                    :class="page === p ? 'bg-s-300 text-white' : 'border border-g-100 bg-white text-g-400 hover:text-g-900 hover:bg-white'"
                    x-text="p"></button>
          </template>
          <button @click="nextPage()" :disabled="page === totalPages"
                  class="w-8 h-8 rounded-lg border border-g-100 bg-white text-g-400 hover:text-g-900 hover:bg-white disabled:opacity-30 disabled:cursor-not-allowed transition-colors flex items-center justify-center">›</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== Context Menu (popup) ===== -->
  <div x-show="menu.open" x-cloak @click.outside="menu.open = false"
       :style="`top: ${menu.y}px; left: ${menu.x}px;`"
       class="fixed bg-white border border-g-100 popup-menu shadow-pop z-50">
    <template x-for="item in menu.items" :key="item.label">
      <div>
        <div x-show="item.divider" class="popup-menu-divider"></div>
        <button @click="runMenu(item)" :disabled="item.disabled"
                class="popup-menu-item" :class="{ 'destructive': item.destructive }">
          <span class="ic-wrap"><span class="ic ic-16" :class="item.icon" :style="`color: ${item.destructive ? '#95122B' : '#0A0A0A'}`"></span></span>
          <span x-text="item.label"></span>
          <span x-show="item.shortcut" class="popup-menu-shortcut" x-text="item.shortcut"></span>
        </button>
      </div>
    </template>
  </div>

  <!-- ===== Detail Drawer ===== -->
  <div x-show="detail" x-cloak x-transition.opacity @keydown.escape.window="detail = null"
       class="fixed inset-0 bg-black/40 z-40 flex justify-end" @click.self="detail = null">
    <div x-show="detail" x-cloak
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
         x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
         class="w-[420px] h-full bg-white shadow-2xl flex flex-col">
      <template x-if="detail">
        <div class="flex flex-col h-full">
          <div class="h-16 px-5 border-b border-g-100 flex items-center gap-3">
            <h2 class="flex-1 text-[16px] font-semibold text-g-900">Transaction Detail</h2>
            <button @click="openMenu($event, rowMenu, detail)" class="w-8 h-8 rounded-full hover:bg-g-50 flex items-center justify-center transition-colors">
              <span class="ic ic-16 ic-dots-v text-g-900"></span>
            </button>
            <button @click="detail = null" class="w-8 h-8 rounded-full hover:bg-g-50 flex items-center justify-center text-g-400 hover:text-g-900 transition-colors">✕</button>
          </div>
          <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-5">
            <div class="flex flex-col items-center gap-3 pt-2">
              <template x-if="detail.avatar"><img :src="detail.avatar" alt="" class="w-16 h-16 rounded-full object-cover" /></template>
              <template x-if="detail.brandIcon">
                <div class="w-16 h-16 rounded-full overflow-hidden flex items-center justify-center" :style="'background:' + detail.brandBg"><img :src="detail.brandIcon" alt="" class="w-8 h-8" /></div>
              </template>
              <div class="flex flex-col items-center gap-1">
                <span class="text-[14px] font-medium text-g-400" x-text="detail.name"></span>
                <span class="text-[28px] font-semibold tracking-tight2" :class="detail.amount >= 0 ? 'text-suc-200' : 'text-g-900'" x-text="formatAmount(detail.amount)"></span>
              </div>
              <span class="rounded-full px-3 py-1 text-[12px] font-semibold tracking-wide1 border"
                    :class="{
                      'bg-suc-0 border-[rgba(64,196,170,0.2)] text-suc-200': detail.status === 'Completed',
                      'bg-por-0 border-por-25 text-por-100': detail.status === 'Scheduled',
                      'bg-[#FFF7E5] border-[rgba(255,170,0,0.2)] text-[#B8860B]': detail.status === 'Pending',
                      'bg-err-0 border-[rgba(223,28,65,0.1)] text-err-200': detail.status === 'Failed'
                    }" x-text="detail.status"></span>
            </div>

            <div class="bg-g-25 rounded-xl border border-g-100 flex flex-col">
              <div class="flex items-center gap-3 px-4 py-3 border-b border-g-100"><span class="flex-1 text-[13px] text-g-400">Transaction ID</span><span class="text-[13px] font-medium text-g-900 font-mono" x-text="detail.id.toUpperCase()"></span></div>
              <div class="flex items-center gap-3 px-4 py-3 border-b border-g-100"><span class="flex-1 text-[13px] text-g-400">Type</span><span class="text-[13px] font-medium text-g-900" x-text="detail.type"></span></div>
              <div class="flex items-center gap-3 px-4 py-3 border-b border-g-100"><span class="flex-1 text-[13px] text-g-400">Category</span><span class="text-[13px] font-medium text-g-900" x-text="detail.category"></span></div>
              <div class="flex items-center gap-3 px-4 py-3 border-b border-g-100"><span class="flex-1 text-[13px] text-g-400">Date & Time</span><span class="text-[13px] font-medium text-g-900" x-text="formatDate(detail.date)"></span></div>
              <div class="flex items-center gap-3 px-4 py-3"><span class="flex-1 text-[13px] text-g-400">Account</span><span class="text-[13px] font-medium text-g-900">Visa •••• 8744</span></div>
            </div>

            <div class="flex flex-col gap-2">
              <span class="text-[13px] font-medium text-g-400">Note</span>
              <p class="text-[14px] text-g-900 leading-relaxed" x-text="detail.note || '—'"></p>
            </div>
          </div>
          <div class="border-t border-g-100 p-4 flex items-center gap-2">
            <button @click="downloadReceipt(detail)" class="flex-1 h-12 rounded-full bg-white border border-g-100 text-[14px] font-semibold text-g-900 hover:bg-g-25 transition-colors">Download receipt</button>
            <button @click="repeatTxn(detail)" class="flex-1 h-12 rounded-full bg-p-300 hover:bg-p-200 text-[14px] font-semibold text-s-300 transition-colors">Repeat</button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ===== New Transaction Modal ===== -->
  <div x-show="newTxnOpen" x-cloak x-transition.opacity @keydown.escape.window="newTxnOpen = false"
       class="fixed inset-0 bg-black/40 z-40 flex items-center justify-center px-4" @click.self="newTxnOpen = false">
    <div x-show="newTxnOpen" x-transition
         class="bg-white rounded-2xl shadow-pop max-w-[480px] w-full">
      <div class="h-16 px-5 border-b border-g-100 flex items-center gap-3">
        <h2 class="flex-1 text-[16px] font-semibold text-g-900">New Transaction</h2>
        <button @click="newTxnOpen = false" class="w-8 h-8 rounded-full hover:bg-g-50 flex items-center justify-center text-g-400 hover:text-g-900 transition-colors">✕</button>
      </div>
      <form @submit.prevent="submitNewTxn()" class="p-5 flex flex-col gap-4">
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[12px] font-medium text-g-400">Name</label>
            <input type="text" x-model="newTxn.name" required class="h-10 px-3 rounded-lg border border-g-100 text-[14px] text-g-900 focus:outline-none focus:ring-2 focus:ring-p-300"/>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[12px] font-medium text-g-400">Type</label>
            <select x-model="newTxn.type" class="h-10 px-3 rounded-lg border border-g-100 text-[14px] text-g-900 bg-white focus:outline-none focus:ring-2 focus:ring-p-300">
              <option>Payment</option><option>Transfer</option><option>Request</option><option>Deposit</option><option>Withdrawal</option>
            </select>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[12px] font-medium text-g-400">Amount (use - for expense)</label>
            <input type="number" step="0.01" x-model.number="newTxn.amount" required class="h-10 px-3 rounded-lg border border-g-100 text-[14px] text-g-900 focus:outline-none focus:ring-2 focus:ring-p-300"/>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[12px] font-medium text-g-400">Category</label>
            <select x-model="newTxn.category" class="h-10 px-3 rounded-lg border border-g-100 text-[14px] text-g-900 bg-white focus:outline-none focus:ring-2 focus:ring-p-300">
              <template x-for="c in categories.filter(c => c !== 'All')" :key="c"><option x-text="c" :value="c"></option></template>
            </select>
          </div>
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="text-[12px] font-medium text-g-400">Note</label>
          <textarea x-model="newTxn.note" rows="2" class="px-3 py-2 rounded-lg border border-g-100 text-[14px] text-g-900 focus:outline-none focus:ring-2 focus:ring-p-300 resize-none"></textarea>
        </div>
        <div class="flex items-center gap-2 pt-2">
          <button type="button" @click="newTxnOpen = false" class="flex-1 h-11 rounded-full border border-g-100 text-[14px] font-semibold text-g-900 hover:bg-g-25 transition-colors">Cancel</button>
          <button type="submit" class="flex-1 h-11 rounded-full bg-p-300 hover:bg-p-200 text-[14px] font-semibold text-s-300 transition-colors">Add Transaction</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  function transactionsPage() {
    return {
      // State
      transactions: [],
      search: '',
      typeFilter: 'All',
      statusFilter: 'All',
      categoryFilter: 'All',
      amountMin: null,
      amountMax: null,
      types: ['All', 'Deposit', 'Withdrawal', 'Transfer', 'Payment', 'Request'],
      statuses: ['All', 'Completed', 'Pending', 'Scheduled', 'Failed'],
      categories: ['All', 'Cash', 'Transfer', 'Salary', 'Subscription', 'Food', 'Transport', 'Shopping', 'Other'],
      sort: { key: 'date', dir: 'desc' },
      selected: [],
      detail: null,
      advancedFilters: false,
      newTxnOpen: false,
      newTxn: { name: '', type: 'Payment', amount: -0, category: 'Food', note: '' },
      // Pagination
      page: 1,
      perPage: 10,
      // Month picker
      monthIndex: 7, // Aug = 7 (0-indexed)
      yearOffset: 0,
      activeYearOffset: 0,
      monthsList: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
      monthFilter: { year: 2024, month: 7 },
      // Context menu
      menu: { open: false, x: 0, y: 0, items: [], target: null, onAction: null },
      // Notifications mock
      notifications: [
        { id:1, title:'Salary received: $4,200.00', time:'2 hours ago', icon:'💰', color:'#EFFEFA', unread:true },
        { id:2, title:'Netflix payment scheduled for Aug 15', time:'5 hours ago', icon:'📺', color:'#FEEFF2', unread:true },
        { id:3, title:'Guy Hawkins sent you $250.00', time:'1 day ago', icon:'💸', color:'#F4F0FF', unread:true },
        { id:4, title:'Card ending 8744 was used', time:'2 days ago', icon:'💳', color:'#F5F5F5', unread:false },
        { id:5, title:'Monthly statement ready', time:'3 days ago', icon:'📄', color:'#F5F5F5', unread:false },
      ],

      init() {
        this.transactions = [...window.MonefyData.transactions];
        // Keyboard shortcuts
        window.addEventListener('keydown', this.handleKey.bind(this));
      },

      handleKey(e) {
        if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) {
          e.preventDefault();
          this.$refs.searchInput?.focus();
        }
        if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          this.openCommandPalette();
        }
      },

      // ---------- Computed ----------
      get filtered() {
        let list = this.transactions;
        if (this.typeFilter !== 'All') list = list.filter(t => t.type === this.typeFilter);
        if (this.statusFilter !== 'All') list = list.filter(t => t.status === this.statusFilter);
        if (this.categoryFilter !== 'All') list = list.filter(t => t.category === this.categoryFilter);
        if (this.amountMin !== null && this.amountMin !== '') list = list.filter(t => Math.abs(t.amount) >= this.amountMin);
        if (this.amountMax !== null && this.amountMax !== '') list = list.filter(t => Math.abs(t.amount) <= this.amountMax);
        if (this.monthFilter.month !== null) {
          list = list.filter(t => { const d = new Date(t.date); return d.getMonth() === this.monthFilter.month && d.getFullYear() === this.monthFilter.year; });
        }
        if (this.search.trim()) {
          const q = this.search.toLowerCase();
          list = list.filter(t => t.name.toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
        }
        const { key, dir } = this.sort;
        const m = dir === 'asc' ? 1 : -1;
        return [...list].sort((a, b) => {
          const va = a[key], vb = b[key];
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * m;
          return String(va).localeCompare(String(vb)) * m;
        });
      },
      get totalIncome() { return this.transactions.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0); },
      get totalExpense() { return this.transactions.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0); },
      get net() { return this.totalIncome - this.totalExpense; },
      get pendingCount() { return this.transactions.filter(t => t.status === 'Pending' || t.status === 'Scheduled').length; },
      get totalPages() { return Math.max(1, Math.ceil(this.filtered.length / this.perPage)); },
      get paged() { const start = (this.page - 1) * this.perPage; return this.filtered.slice(start, start + this.perPage); },
      get allSelected() { return this.paged.length > 0 && this.paged.every(t => this.selected.includes(t.id)); },
      get someSelected() { return this.paged.some(t => this.selected.includes(t.id)) && !this.allSelected; },
      get hasActiveFilters() { return this.search || this.typeFilter !== 'All' || this.statusFilter !== 'All' || this.categoryFilter !== 'All' || this.amountMin || this.amountMax; },
      get activeAdvancedCount() {
        let n = 0;
        if (this.categoryFilter !== 'All') n++;
        if (this.amountMin) n++;
        if (this.amountMax) n++;
        return n;
      },
      get monthLabel() { return this.monthFilter.month === null ? 'All time' : `${this.monthsList[this.monthFilter.month]} ${this.monthFilter.year}`; },
      get columns() { return [
        { key: 'name', label: 'Name', style: 'width: 240px;' },
        { key: 'type', label: 'Type', style: 'width: 120px;' },
        { key: 'category', label: 'Category', style: 'width: 140px;' },
        { key: 'amount', label: 'Amount', style: 'width: 130px;' },
        { key: 'date', label: 'Date', style: 'flex: 1;' },
        { key: 'status', label: 'Status', style: 'width: 120px;' },
      ]; },
      get statsCards() {
        const tot = this.totalIncome;
        return [
          { key: 'income', label: 'Total Income', value: '+ $' + this.totalIncome.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            filter: () => { this.typeFilter = 'Deposit'; }, menu: this.statMenu('income') },
          { key: 'expense', label: 'Total Expense', value: '- $' + this.totalExpense.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            filter: () => { this.amountMax = null; this.amountMin = null; this.advancedFilters = true; }, menu: this.statMenu('expense') },
          { key: 'pending', label: 'Pending', value: this.pendingCount + ' txns',
            filter: () => { this.statusFilter = 'Pending'; }, menu: this.statMenu('pending') },
          { key: 'net', label: 'Net', value: (this.net >= 0 ? '+ $' : '- $') + Math.abs(this.net).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),
            badge: (this.net >= 0 ? '↑ ' : '↓ ') + Math.abs(this.net/(tot||1)*100).toFixed(0) + '%',
            badgeClass: this.net >= 0 ? 'bg-suc-0 border-[rgba(64,196,170,0.2)] text-suc-200' : 'bg-err-0 border-[rgba(223,28,65,0.1)] text-err-200',
            filter: null, menu: this.statMenu('net') },
        ];
      },
      get rowMenu() {
        return [
          { icon: 'ic-eye',      label: 'View details',      action: 'view' },
          { icon: 'ic-copy',     label: 'Copy ID',           action: 'copy' },
          { icon: 'ic-repeat',   label: 'Repeat',            action: 'repeat' },
          { icon: 'ic-download', label: 'Download receipt',  action: 'download' },
          { icon: 'ic-check',    label: 'Mark as paid',      action: 'paid' },
          { icon: 'ic-trash',    label: 'Delete',            action: 'delete', destructive: true, shortcut: '⌫', divider: true },
        ];
      },
      statMenu(key) { return [
        { icon: 'ic-eye',      label: 'View details',  action: 'stat-view' },
        { icon: 'ic-download', label: 'Export data',   action: 'stat-export' },
        { icon: 'ic-trash',    label: 'Hide card',     action: 'stat-hide' },
      ]; },

      // ---------- Actions ----------
      sortBy(key) {
        if (this.sort.key === key) this.sort.dir = this.sort.dir === 'asc' ? 'desc' : 'asc';
        else { this.sort.key = key; this.sort.dir = 'asc'; }
        this.page = 1;
      },
      toggleOne(id) {
        if (this.selected.includes(id)) this.selected = this.selected.filter(x => x !== id);
        else this.selected.push(id);
      },
      toggleAll() {
        if (this.allSelected) this.selected = this.selected.filter(id => !this.paged.some(t => t.id === id));
        else this.selected = [...new Set([...this.selected, ...this.paged.map(t => t.id)])];
      },
      openDetail(t) { this.detail = t; },
      formatAmount(n) { return window.MonefyData.formatAmount(n); },
      formatDate(d) { return window.MonefyData.formatDate(d); },

      // Pagination
      prevPage() { if (this.page > 1) this.page--; },
      nextPage() { if (this.page < this.totalPages) this.page++; },

      // Month picker
      setMonth(idx) {
        if (idx === null) { this.monthFilter = { year: 2024 + this.yearOffset, month: null }; }
        else { this.monthFilter = { year: 2024 + this.yearOffset, month: idx }; this.monthIndex = idx; this.activeYearOffset = this.yearOffset; }
        this.page = 1;
      },
      setMonthToCurrent() {
        const now = new Date();
        this.monthFilter = { year: now.getFullYear(), month: now.getMonth() };
        this.monthIndex = now.getMonth(); this.yearOffset = now.getFullYear() - 2024; this.activeYearOffset = this.yearOffset;
      },

      // Filters
      resetFilters() {
        this.search = ''; this.typeFilter = 'All'; this.statusFilter = 'All'; this.categoryFilter = 'All';
        this.amountMin = null; this.amountMax = null; this.page = 1;
      },
      applyQuickFilter(fn) { fn(); this.page = 1; window.toast('Filter applied', { type: 'info' }); },

      // Context menu
      openMenu(event, items, target) {
        const rect = event.currentTarget.getBoundingClientRect();
        this.menu = {
          open: true,
          x: Math.min(rect.right - 180, window.innerWidth - 200),
          y: rect.bottom + 4,
          items,
          target,
        };
      },
      runMenu(item) {
        this.menu.open = false;
        const t = this.menu.target;
        switch (item.action) {
          case 'view': this.openDetail(t); break;
          case 'copy': navigator.clipboard?.writeText(t.id.toUpperCase()); window.toast('Transaction ID copied'); break;
          case 'repeat': this.repeatTxn(t); break;
          case 'download': this.downloadReceipt(t); break;
          case 'paid':
            t.status = 'Completed';
            this.transactions = [...this.transactions];
            window.toast(t.name + ' marked as paid');
            break;
          case 'delete':
            window.confirmDialog('Delete transaction from ' + t.name + '? This cannot be undone.', { destructive: true, confirmText: 'Delete' })
              .then(ok => { if (ok) { this.transactions = this.transactions.filter(x => x.id !== t.id); window.toast('Transaction deleted', { type: 'success' }); if (this.detail?.id === t.id) this.detail = null; } });
            break;
          case 'stat-view': window.toast('Opening detailed report…', { type: 'info' }); break;
          case 'stat-export': this.exportData(); break;
          case 'stat-hide': window.toast('Card hidden (refresh to restore)', { type: 'info' }); break;
        }
      },

      // Bulk actions
      bulkMarkPaid() {
        this.transactions.forEach(t => { if (this.selected.includes(t.id)) t.status = 'Completed'; });
        this.transactions = [...this.transactions];
        window.toast(this.selected.length + ' transactions marked as paid');
        this.selected = [];
      },
      bulkExport() { this.exportData(); window.toast(this.selected.length + ' transactions exported as CSV'); },
      bulkDelete() {
        const n = this.selected.length;
        window.confirmDialog('Delete ' + n + ' transaction' + (n>1?'s':'') + '? This cannot be undone.', { destructive: true, confirmText: 'Delete all' })
          .then(ok => { if (ok) { this.transactions = this.transactions.filter(t => !this.selected.includes(t.id)); window.toast(n + ' transactions deleted'); this.selected = []; } });
      },

      // Export
      exportData() {
        const rows = [['ID','Name','Type','Category','Amount','Date','Status','Note']];
        this.filtered.forEach(t => rows.push([t.id, t.name, t.type, t.category, t.amount, t.date, t.status, t.note || '']));
        const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'transactions-' + Date.now() + '.csv'; a.click();
        URL.revokeObjectURL(url);
        window.toast('Exported ' + this.filtered.length + ' transactions as CSV');
      },

      downloadReceipt(t) {
        const text = `Monefy Receipt\n\nID: ${t.id}\nName: ${t.name}\nType: ${t.type}\nAmount: ${this.formatAmount(t.amount)}\nDate: ${this.formatDate(t.date)}\nStatus: ${t.status}\nNote: ${t.note || '—'}\n`;
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = `receipt-${t.id}.txt`; a.click();
        URL.revokeObjectURL(url);
        window.toast('Receipt downloaded');
      },

      repeatTxn(t) {
        const newId = 't' + String(Date.now()).slice(-4);
        const copy = { ...t, id: newId, date: new Date().toISOString(), status: 'Pending' };
        this.transactions = [copy, ...this.transactions];
        this.detail = null;
        window.toast('Duplicated as pending transaction', {
          action: { label: 'Undo', onClick: () => { this.transactions = this.transactions.filter(x => x.id !== newId); window.toast('Undone'); } }
        });
      },

      submitNewTxn() {
        const t = { id: 't' + String(Date.now()).slice(-4), name: this.newTxn.name, type: this.newTxn.type, category: this.newTxn.category, amount: this.newTxn.amount, date: new Date().toISOString(), status: 'Pending', note: this.newTxn.note, avatar: 'assets/avatar-kristin.jpg' };
        this.transactions = [t, ...this.transactions];
        this.newTxn = { name: '', type: 'Payment', amount: -0, category: 'Food', note: '' };
        this.newTxnOpen = false;
        window.toast('Transaction added');
      },

      openCommandPalette() { window.toast('Command palette coming in Phase 7', { type: 'info' }); this.$refs.searchInput?.focus(); },
    }
  }
</script>
